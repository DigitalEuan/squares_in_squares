<!--
    Found by David Ellsworth on December 7, 2024.

    x1 := 1 + 8*Tan[a];
    v2 := Tan[a];
    y3 := s - (1 + 5*Tan[b] + Cos[b] - 7*Sin[b] + 29/Cos[b]);
    v4 := Tan[b];
    solution = RootReduce[Solve[{s == 12*Cos[a] + Sin[a] + 35 && 0 < a < Pi/4,
                                 s == 1 + 8*Tan[a] + 41/Cos[a] - (s - 46 + 3)*Tan[a] + 1,
                                 s == 40 + 7*Cos[b] + Sin[b]},
                                {s, a, b}][[2]]];
    ToString[s[[1]] /. solution, InputForm]
    ToString[a[[1]] /. solution, InputForm]
    ToString[b[[1, 1]] /. solution, InputForm]
    N[{s, a*180/Pi, b*180/Pi, x1, v2, y3, v4} /. {s -> s[[1]], 
        a -> a[[1]], b -> b[[1, 1]]} /. solution, 35]
(*
    s = Root[1423760 - 127660*# + 5644*#^2 - 123*#^3 + #^4, 2]
    a = 2*ArcTan[Root[-2 + 3*# + 51*#^2 + 29*#^3 + 31*#^4, 2]]
    b = 2*ArcTan[Root[394 + 3047*# - 16643*#^2 - 34139*#^3 + 91535*#^4 - 39683*#^5 + 153191*#^6 - 13249*#^7 + 61483*#^8, 3]]
*)
-->
