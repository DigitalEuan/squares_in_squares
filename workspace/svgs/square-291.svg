<?xml version="1.0" encoding="UTF-8"?>
<!--
    Found by Sigvart Brendberg's program, https://hohmiyazawa.github.io/squares_in_rects/squaredrawer.html
    Made by combining two copies of the s(65) found by Frits Göbel in early 1979.
    Beats the result of adding nine "L"s to s(65), which only results in an s(290).
-->
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd" [
    <!ENTITY s "17.53553390593273762200422181052425"> <!-- 14 + Sqrt[2]*5/2 -->
    <!ENTITY s1 "8.53553390593273762200422181052425"> <!--  5 + Sqrt[2]*5/2 -->
]>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="0 0 &s; &s;" style="fill:#B2B2B2; stroke:black; stroke-width:0.002" id="svg">
    <script xlink:href="svgDisp.js"/>
    <defs>
        <rect width="&s;" height="&s;" id="outer"/>
        <rect width="1" height="1" id="one"/>
        <g id="two">
            <rect width="2" height="1"/>
            <path style="fill:none" d="M1,0 V1"/>
        </g>
    </defs>
    <use xlink:href="#outer" style="fill:white; stroke:none"/>
    <g id="first">
        <g id="side1">
            <path style="stroke:none" d="M4,0 V1 H3 V2 H2 V3 H1 V4 H0 V0"/>
            <path style=  "fill:none" d="M0,1 H4 V0
                                         M0,2 H3 V0
                                         M0,3 H2 V0
                                         M0,4 H1 V0"/>
        </g>
        <use xlink:href="#side1" transform="translate(&s1;     ) scale(-1  1)"/>
        <use xlink:href="#side1" transform="translate(0    &s1;) scale( 1 -1)"/>
        <use xlink:href="#side1" transform="translate(&s1; &s1;) scale(-1 -1)"/>
        <g transform="translate(2.5 2.5) rotate(45) translate(0 -2.5)">
            <rect width="5" height="5"/>
            <path style="fill:none" d="M0,1 H5 M1,0 V5
                                       M0,2 H5 M2,0 V5
                                       M0,3 H5 M3,0 V5
                                       M0,4 H5 M4,0 V5"/>
        </g>
    </g>
    <use xlink:href="#first" transform="translate(9 9)"/>
    <g transform="translate(&s1;)">
        <path style="stroke:none" d="M0,0 V9 H9 V0"/>
        <path style=  "fill:none" d="M0,0 V9 H9
                                     M1,0 V9 M0,1 H9
                                     M2,0 V9 M0,2 H9
                                     M3,0 V9 M0,3 H9
                                     M4,0 V9 M0,4 H9
                                     M5,0 V9 M0,5 H9
                                     M6,0 V9 M0,6 H9
                                     M7,0 V9 M0,7 H9
                                     M8,0 V9 M0,8 H9"/>
    </g>
    <g transform="translate(0 &s;) scale(1 -1)">
        <path style="stroke:none" d="M0,9 H8 V8 H9 V0 H0"/>
        <path style=  "fill:none" d="M0,9 H8 V8 H9 V0
                                     M0,8 H8 V0
                                     M1,0 V9 M0,1 H9
                                     M2,0 V9 M0,2 H9
                                     M3,0 V9 M0,3 H9
                                     M4,0 V9 M0,4 H9
                                     M5,0 V9 M0,5 H9
                                     M6,0 V9 M0,6 H9
                                     M7,0 V9 M0,7 H9
                                     M8,9 H&s1;
                                     M9,8 V&s1;"/>
    </g>
    <use xlink:href="#outer" style="fill:none"/>
</svg>