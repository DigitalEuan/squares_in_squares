                                     M 7,0 V 5 H0
                                     M 6,0 V 6 H0
                                     M 5,0 V 7 H0
                                     M 4,0 V 8 H0
                                     M 3,0 V 9 H0
                                     M 2,0 V10 H0
                                     M 1,0 V11 H0"/>
    </g>
    <g transform="translate(0 &s;) scale(1 -1)">
        <path style="stroke:none" d="M2,0 V1 H1 V2 H0 V0"/>
        <path style=  "fill:none" d="M2,0 V1 H1 V2 H0
                                     M1,0 V1 H0"/>
    </g>
    <g transform="translate(&s; &s;) scale(-1 -1)">
        <path style="stroke:none" d="M12,0 V 1 H11 V2 H10 V3 H9 V4 H8 V5 H7 V6 H6 V7 H5 V8 H4 V9 H3 V10 H2 V11 H1 V12 H0 V0"/>
        <path style=  "fill:none" d="M12,0 V 1 H0
                                     M11,0 V 2 H0
                                     M10,0 V 3 H0
                                     M 9,0 V 4 H0
                                     M 8,0 V 5 H0
                                     M 7,0 V 6 H0
                                     M 6,0 V 7 H0
                                     M 5,0 V 8 H0
                                     M 4,0 V 9 H0
                                     M 3,0 V10 H0
                                     M 2,0 V11 H0
                                     M 1,0 V12 H0"/>
    </g>
    <g transform="translate(&s;) scale(-1 1)">
        <path style="stroke:none" d="M1,0 V1 H0 V0"/>
        <path style=  "fill:none" d="M1,0 V1 H0"/>
    </g>
    <g transform="translate(2 &s;) translate(0 -1) rotate(-&a;) translate(0 -&r1;)">
        <defs>
            <g id="strip">
                <use xlink:href="#one" transform=""/>
                <use xlink:href="#one" transform="&tr1;"/>
                <use xlink:href="#one" transform="&tr1;&tr0;"/>
                <use xlink:href="#one" transform="&tr1;&tr0;&tr1;"/>
                <use xlink:href="#one" transform="&tr1;&tr0;&tr1;&tr1;"/>
                <use xlink:href="#one" transform="&tr1;&tr0;&tr1;&tr1;&tr0;"/>
                <use xlink:href="#one" transform="&tr1;&tr0;&tr1;&tr1;&tr0;&tr1;"/>
                <use xlink:href="#one" transform="&tr1;&tr0;&tr1;&tr1;&tr0;&tr1;&tr1;"/>
                <use xlink:href="#one" transform="&tr1;&tr0;&tr1;&tr1;&tr0;&tr1;&tr1;&tr1;"/>
                <use xlink:href="#one" transform="&tr1;&tr0;&tr1;&tr1;&tr0;&tr1;&tr1;&tr1;&tr0;"/>
                <use xlink:href="#one" transform="&tr1;&tr0;&tr1;&tr1;&tr0;&tr1;&tr1;&tr1;&tr0;&tr1;"/>
                <use xlink:href="#one" transform="&tr1;&tr0;&tr1;&tr1;&tr0;&tr1;&tr1;&tr1;&tr0;&tr1;&tr1;"/>
                <use xlink:href="#one" transform="&tr1;&tr0;&tr1;&tr1;&tr0;&tr1;&tr1;&tr1;&tr0;&tr1;&tr1;&tr1;"/>
                <use xlink:href="#one" transform="&tr1;&tr0;&tr1;&tr1;&tr0;&tr1;&tr1;&tr1;&tr0;&tr1;&tr1;&tr1;&tr0;"/>
                <use xlink:href="#one" transform="&tr1;&tr0;&tr1;&tr1;&tr0;&tr1;&tr1;&tr1;&tr0;&tr1;&tr1;&tr1;&tr0;&tr1;"/>
            </g>
        </defs>
        <use xlink:href="#one"/>
        <use xlink:href="#strip" transform="&tr1;"/>
        <g transform="translate(-&v2; -1)">
            <use xlink:href="#one"/>
            <use xlink:href="#strip" transform="&tr1;"/>
        </g>
    </g>
    <g transform="translate(0 &y3;) rotate(-&a;)">
