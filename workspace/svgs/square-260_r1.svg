<!--
    Found by David Ellsworth on December 19, 2024.
        Based on the s(83) found by Károly Hajba in September 2024, which:
            - Improved upon the s(83) found by Evert Stenlund in early 1980 (which added an "L" to the s(66) he found in early 1980).
            - Was then improved by David W. Cantrell on November 21, 2024.
            - Extends the s(17) found by John Bidwell in 1998, as does this s(260).
    Exact polynomial root solution by David Ellsworth on December 19, 2024.
    Not optimal. Beaten by s(260)=16.65685424949238... and s(262)=16.70710678118654...

    Unset[{s, a, b, r1, v2, y3, v4, x5, y6, r7o, r7, f1, f2, f3, solution}];
    r1 = 1 - (s - 16)*Sin[a];
    v2 = -RotationTransform[a][{1, -1}][[2]];
    y3 = s - 2 - Cos[a];
    v4 = RotationTransform[a][({2, s - 1} + RotationTransform[-a][{1 - v2, -r1 - 1 - v2}]) - {0, y3}][[2]] - 1;
    x5 = {0, y3} + RotationTransform[-a][{19, v4 - 12*v2}];
    x5 = FullSimplify[(x5 + RotationTransform[-a][{0, (1 - x5[[2]])/Cos[a]}])[[1]]];
    y6 = (s - 14) - (({2, s - 1} + RotationTransform[-a][{19, 1 - r1 - 13*v2}])[[1]] - (s - 1))*(Tan[a] + Cot[a]);
    r7o = ((s - 1) - (x5 + 1))*Cos[b];
    r7 = 1 - ((y6 - 1) - 1)*Sin[b];
        (*f1 = RotationTransform[a][({0,y3}+RotationTransform[-a][{1,v4}])-{1,13}][[2]];*)
        (*f2 = RotationTransform[-b][{s-1,y6-1}-{x5+1,1}][[1]]-1;*)
    f2 = r7o - r7; (* equivalent to the old "f2" expression above, but simpler *)
    f3 = RotationTransform[a][({2, s - 1} + RotationTransform[-a][{19 - v2, -r1 - 13*v2}]) - ({s - 1, 1} + RotationTransform[b][{-r7, 1}])][[1]];
    f1 = Det[Grad[{s, f2, f3}, {s, a, b}]];
    (*solution = FindRoot[{f1 == 0, f2 == 0, f3 == 0}, {{s, 16.66}, {a, .7}, {b, .6}}, WorkingPrecision -> 100];*)
    AbsoluteTiming[solution = Solve[{f1 == 0, f2 == 0, f3 == 0}, {s, a, b}, GeneratedParameters -> C][[6]] /. _C -> 0][[1]]  (* took 10.215 seconds *)
    N[{s, a*180/Pi, b*180/Pi, r1, v2, y3, v4, x5, y6, r7} /. solution, 40]
        (*ToString[RootReduce[solution], InputForm]*)
    (* RootReduce[] is impractically slow in this case; verified RootApproximant[] output to be exactly correct by comparing 200000 digits *)
    AbsoluteTiming[ToString[RootApproximant[N[s              /. solution, 10000], 62], InputForm]] (* took 1042.910 seconds *)
    AbsoluteTiming[ToString[RootApproximant[N[Tan[a[[1, 1]]] /. solution,  5000], 62], InputForm]] (* took  322.860 seconds *)
    AbsoluteTiming[ToString[RootApproximant[N[Tan[b[[1, 1]]] /. solution,  5000], 62], InputForm]] (* took  305.476 seconds *)
