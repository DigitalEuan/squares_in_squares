<?xml version="1.0" encoding="UTF-8"?>
<!--
    Rigid packing made by combining two copies of the rigid s(28) alternative found by David Ellsworth in June 2023, based on the s(28) found by Frits Göbel in early 1979, and one of the s(40) found by Frits Göbel in early 1979.
-->
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd" [
    <!ENTITY s  "18.82842712474619009760337744842"> <!-- 16 + Sqrt[2]*2 -->
    <!ENTITY s2  "6.82842712474619009760337744842"> <!--  4 + Sqrt[2]*2 -->
    <!ENTITY s1  "5.82842712474619009760337744842"> <!--  3 + Sqrt[2]*2 -->
    <!ENTITY sf   ".82842712474619009760337744842"> <!--      Sqrt[2]*2 -->
]>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="0 0 &s; &s;" style="fill:#B2B2B2; stroke:black; stroke-width:0.002" id="svg">
    <script xlink:href="svgDisp.js"/>
    <defs>
        <rect width="&s;" height="&s;" id="outer"/>
    </defs>
    <use xlink:href="#outer" style="fill:white; stroke:none"/>
    <g id="s40">
        <g id="side2">
            <path style="stroke:none" d="M3,0 V1 H2 V2 H1 V3 H0 V0"/>
            <path style=  "fill:none" d="M0,1 H3 V0
                                         M0,2 H2 V0
                                         M0,3 H1 V0"/>
        </g>
        <use xlink:href="#side2" transform="translate(&s2;     ) scale(-1  1)"/>
        <use xlink:href="#side2" transform="translate(&s2; &s2;) scale(-1 -1)"/>
        <use xlink:href="#side2" transform="translate(0    &s2;) scale( 1 -1)"/>
        <g transform="translate(2 2) rotate(45) translate(0 -2)">
            <rect width="4" height="4"/>
            <path style="fill:none" d="M0,1 H4 M1,0 V4
                                       M0,2 H4 M2,0 V4
                                       M0,3 H4 M3,0 V4"/>
        </g>
    </g>
    <g id="s28" transform="translate(7 6)">
        <g id="side1">
            <path style="stroke:none" d="M2,0 V1 H1 V2 H0 V0"/>
            <path style=  "fill:none" d="M2,0 V1 H0
                                         M1,0 V2 H0"/>
        </g>
        <use xlink:href="#side1" transform="translate(&s1;     ) scale(-1  1)"/>
        <use xlink:href="#side1" transform="translate(0    &s1;) scale( 1 -1)"/>
        <use xlink:href="#side1" transform="translate(&s1; &s1;) scale(-1 -1)"/>
        <g transform="translate(1.5 1.5) rotate(45) translate(0 -2)">
            <path d="M1,0 H3 V1 H4 V3 H3 V4 H1 V3 H0 V1 H1 Z"/>
            <path style="fill:none" d="M1,1 H3 V3 H1 Z
                                       M0,2 H4
                                       M2,0 V4"/>
        </g>
        <g id="pair">
            <g transform="scale(.5) translate(0 &s1;) translate(0 -1) scale(2)" id="one">
                <rect style="stroke:none" width="1" height="1"/>
                <path style=  "fill:none" d="M0,0 H1 V1 H0"/>
            </g>
            <use xlink:href="#one" transform="translate(&s1;) scale(-1 1)"/>
        </g>
        <use xlink:href="#pair" transform="translate(&s1;) rotate(90)"/>
    </g>
    <use xlink:href="#s40" transform="translate(12 12)"/>
    <g transform="translate(&s;  ) scale(-1 1)">
        <path d="M12,0 V6 H6 V12 H0 V0"/>
        <path style="fill:none" d="M11,0 V 6 M0,11 H 6
                                   M10,0 V 6 M0,10 H 6
                                   M 9,0 V 6 M0, 9 H 6
                                   M 8,0 V 6 M0, 8 H 6
                                   M 7,0 V 6 M0, 7 H 6
                                   M 6,0 V 6 H0
                                   M 5,0 V12 M0, 5 H12
                                   M 4,0 V12 M0, 4 H12
                                   M 3,0 V12 M0, 3 H12
                                   M 2,0 V12 M0, 2 H12
                                   M 1,0 V12 M0, 1 H12
                                   M11&sf;,6 V6&sf;
                                   M12    ,6 V6&sf;
                                   M6,11&sf; H6&sf;
                                   M6,12     H6&sf;"/>
    </g>
    <g transform="translate(0 &s;) scale(1 -1)">
        <path d="M12,0 V7 H7 V12 H0 V0"/>
        <path style="fill:none" d="M11,0 V 7 M0,11 H 7
                                   M10,0 V 7 M0,10 H 7
                                   M 9,0 V 7 M0, 9 H 7
                                   M 8,0 V 7 M0, 8 H 7
                                   M 7,0 V 7 H0
                                   M 6,0 V12 M0, 6 H12
                                   M 5,0 V12 M0, 5 H12
                                   M 4,0 V12 M0, 4 H12
                                   M 3,0 V12 M0, 3 H12
                                   M 2,0 V12 M0, 2 H12
                                   M 1,0 V12 M0, 1 H12"/>
    </g>
    <use xlink:href="#outer" style="fill:none"/>
</svg>